name: CI

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "flowdesk/**"
      - "documind/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "flowdesk/**"
      - "documind/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flowdesk:
    name: FlowDesk tests and production dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowdesk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flowdesk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

  documind-api:
    name: DocuMind API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documind
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: documind/pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run API and processing tests
        run: python -m pytest

  documind-web:
    name: DocuMind web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documind/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: documind/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test web app
        run: npm test -- --run

      - name: Build web app
        env:
          VITE_DOCUMIND_AUTH_MODE: local
        run: npm run build
