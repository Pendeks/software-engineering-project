services:
  ollama:
    image: ollama/ollama:0.40.13
    volumes:
      - documind-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 24

  ollama-embedding-model:
    image: ollama/ollama:0.40.13
    entrypoint: ["ollama"]
    command: ["pull", "${DOCUMIND_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  ollama-chat-model:
    image: ollama/ollama:0.40.13
    entrypoint: ["ollama"]
    command: ["pull", "${DOCUMIND_OLLAMA_CHAT_MODEL:-granite3.3:2b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama-embedding-model:
        condition: service_completed_successfully

  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${DOCUMIND_POSTGRES_PASSWORD:?Set DOCUMIND_POSTGRES_PASSWORD before starting Compose}
    volumes:
      - documind-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DOCUMIND_API_TOKEN: ${DOCUMIND_API_TOKEN:?Set DOCUMIND_API_TOKEN before starting Compose}
      DOCUMIND_MODEL_PROVIDER: ${DOCUMIND_MODEL_PROVIDER:-ollama}
      DOCUMIND_OLLAMA_BASE_URL: http://ollama:11434
      DOCUMIND_OLLAMA_EMBEDDING_MODEL: ${DOCUMIND_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      DOCUMIND_OLLAMA_CHAT_MODEL: ${DOCUMIND_OLLAMA_CHAT_MODEL:-granite3.3:2b}
      DOCUMIND_DATABASE_URL: postgresql+psycopg://documind:${DOCUMIND_POSTGRES_PASSWORD}@database:5432/documind
      DOCUMIND_STORAGE_PATH: /var/lib/documind/uploads
      DOCUMIND_WEB_STATIC_PATH: /app/web-dist
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - documind-uploads:/var/lib/documind/uploads
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-chat-model:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "documind.worker"]
    env_file:
      - .env
    environment:
      DOCUMIND_API_TOKEN: ${DOCUMIND_API_TOKEN:?Set DOCUMIND_API_TOKEN before starting Compose}
      DOCUMIND_MODEL_PROVIDER: ${DOCUMIND_MODEL_PROVIDER:-ollama}
      DOCUMIND_OLLAMA_BASE_URL: http://ollama:11434
      DOCUMIND_OLLAMA_EMBEDDING_MODEL: ${DOCUMIND_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      DOCUMIND_OLLAMA_CHAT_MODEL: ${DOCUMIND_OLLAMA_CHAT_MODEL:-granite3.3:2b}
      DOCUMIND_DATABASE_URL: postgresql+psycopg://documind:${DOCUMIND_POSTGRES_PASSWORD}@database:5432/documind
      DOCUMIND_STORAGE_PATH: /var/lib/documind/uploads
    volumes:
      - documind-uploads:/var/lib/documind/uploads
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-chat-model:
        condition: service_completed_successfully
    healthcheck:
      disable: true

volumes:
  documind-database:
  documind-uploads:
  documind-models:
