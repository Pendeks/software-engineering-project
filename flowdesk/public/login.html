<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151922" />
    <title>Sign in | FlowDesk</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151922;
        --panel: #2d3240;
        --primary: #554cf5;
        --text: #f1f2f6;
        --muted: #9299a9;
        --danger: #f87171;
        --border: rgba(148, 157, 176, 0.16);
        --input-bg: #202531;
        --button-text: #ffffff;
      }

      body.light-mode {
        color-scheme: light;
        --bg: #eef0f5;
        --panel: #ffffff;
        --primary: #5148e8;
        --text: #1b2030;
        --muted: #687184;
        --danger: #dc2626;
        --border: rgba(31, 41, 55, 0.12);
        --input-bg: #fff;
        --button-text: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 16px Inter, "Segoe UI", Arial, sans-serif;
      }

      .login-shell { width: min(100%, 420px); }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .brand {
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .theme-toggle {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font-size: 18px;
      }

      .panel {
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.14);
      }

      h1 { margin: 0 0 8px; font-size: 28px; }
      .intro { margin: 0 0 28px; color: var(--muted); line-height: 1.5; }

      .form-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      label { font-size: 14px; font-weight: 600; }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--input-bg);
        color: var(--text);
        font: inherit;
      }

      button, input { font: inherit; }

      .submit {
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 5px;
        background: var(--primary);
        color: var(--button-text);
        font-weight: 700;
        cursor: pointer;
      }

      .submit:disabled { cursor: wait; opacity: 0.7; }
      .message { min-height: 22px; margin: 14px 0 0; color: var(--muted); font-size: 14px; }
      .message.error { color: var(--danger); }

      input:focus-visible, button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .demo {
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .demo strong { color: var(--text); }

      @media (max-width: 480px) {
        .panel { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <div class="topline">
        <span class="brand">FlowDesk</span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light mode">☀</button>
      </div>
      <section class="panel" aria-labelledby="loginTitle">
        <h1 id="loginTitle">Welcome back</h1>
        <p class="intro">Sign in to open your team's operations workspace.</p>
        <form id="loginForm">
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="ops@example.com" required />
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
          </div>
          <button id="submitButton" class="submit" type="submit">Sign in</button>
          <p id="authStatus" class="message" role="status" aria-live="polite"></p>
        </form>
        <div class="demo">
          Demo accounts (passwords are public and for testing only)<br />
          <strong>Admin:</strong> ops@example.com / securepass123<br />
          <strong>Manager:</strong> ava@example.com / managerpass123<br />
          <strong>Member:</strong> noah@example.com / memberpass123<br />
          <strong>Viewer:</strong> mila@example.com / viewerpass123
        </div>
      </section>
    </main>
    <script>
      const tokenKey = 'flowdesk-token';
      const themeKey = 'flowdesk-theme';
      const token = localStorage.getItem(tokenKey);

      if (token) {
        window.location.replace('/dashboard');
      }

      function applyTheme(theme) {
        const isLight = theme === 'light';
        document.body.classList.toggle('light-mode', isLight);
        const toggle = document.getElementById('themeToggle');
        toggle.textContent = isLight ? '\u263e' : '\u2600';
        toggle.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
        localStorage.setItem(themeKey, theme);
      }

      applyTheme(localStorage.getItem(themeKey) || 'dark');

      document.getElementById('themeToggle').addEventListener('click', () => {
        const nextTheme = document.body.classList.contains('light-mode') ? 'dark' : 'light';
        applyTheme(nextTheme);
      });

      document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = document.getElementById('submitButton');
        const status = document.getElementById('authStatus');
        button.disabled = true;
        status.textContent = 'Signing in...';
        status.classList.remove('error');

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('email').value.trim(),
              password: document.getElementById('password').value
            })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(result.error || 'Unable to sign in.');
          }

          localStorage.setItem(tokenKey, result.token);
          form.reset();
          window.location.replace('/dashboard');
        } catch (error) {
          status.textContent = error.message;
          status.classList.add('error');
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
